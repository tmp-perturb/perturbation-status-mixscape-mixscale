name: Publish fixed environments

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [mixscape, mixscale]
    steps:
      - uses: actions/checkout@v4
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2
      - name: Build and test image
        run: apptainer build "${{ matrix.environment }}.sif" "environment/${{ matrix.environment }}.def"
      - name: Publish public release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.4.2 >/dev/null 2>&1 || gh release create v0.4.2 --title "Fixed environments v0.4.2" --notes "Versioned Apptainer environments for the Omnibenchmark modules." || gh release view v0.4.2
          gh release upload v0.4.2 "${{ matrix.environment }}.sif" --clobber
