module: M03
method: Mixscape
dataset: norman2019
source_h5ad: runtime/source/01_standardize_inputs/outputs/norman2019/perturbation_adata.h5ad
input_dir: runtime/source/03_mixscape/inputs/norman2019
output_dir: runtime/source/03_mixscape/outputs/norman2019
row_chunk_size: 512
selection:
  mode: eligible
  eligible_assignment_structures:
    - single_guide
    - concordant_construct
  max_cells: 0
metadata_exclude_regex: '^(guide_|guide_identity$|guide_ids$)'
seed: 20260902
logging:
  directory: runtime/source/03_mixscape/logs/norman2019
  stage_log: runtime/source/03_mixscape/logs/norman2019/stage_resources.jsonl
checkpoints:
  enabled: true
  directory: runtime/source/03_mixscape/checkpoints/norman2019
mixscape:
  input_assay: RNA
  signature_assay: PRTB
  signature_slot: data
  classification_slot: scale.data
  guide_class: gene
  nt_cell_class: non-targeting
  split_by: batch_id
  num_neighbors: 20
  reduction: pca
  labels: gene
  nt_class_name: non-targeting
  new_class_name: mixscape_class
  min_de_genes: 10
  min_cells: 5
  de_assay: RNA
  logfc_threshold: 0.25
  iter_num: 10
  prtb_type: CRISPRa
  nfeatures: 2000
  npcs: 30
